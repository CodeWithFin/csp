services:
  web:
    build: .
    image: siscom-connect
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATA_DIR: /app/data
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
    volumes:
      - inquiries-data:/app/data
    restart: unless-stopped

volumes:
  inquiries-data:
